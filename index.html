<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도쿄 항공권 최저가</title>
<meta name="description" content="김포·인천 ↔ 하네다·나리타 4개 노선 최저가 한눈에 비교">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-soft: #eff4ff; --best: #059669; --best-soft: #ecfdf5; --warn-soft: #fff7ed; --warn: #9a3412;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #eceef2; --muted: #9aa1ad; --line: #2a2f38;
      --accent: #6b9bff; --accent-soft: #1a2440; --best: #34d399; --best-soft: #0f2a22; --warn-soft: #2a1c10; --warn: #fdba74;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }

  form { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); align-items: end; }
  label, .field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }

  /* 두 손잡이 시간 범위 슬라이더 */
  .full { grid-column: 1 / -1; }
  .range-head { display: flex; justify-content: space-between; align-items: baseline; }
  .range-head b { color: var(--accent); font-size: 14px; font-variant-numeric: tabular-nums; }
  .range { position: relative; height: 28px; }
  .range .track { position: absolute; left: 10px; right: 10px; top: 11px; height: 6px; border-radius: 3px; background: var(--line); }
  .range .fill { position: absolute; top: 11px; height: 6px; border-radius: 3px; background: var(--accent); }
  .range input { position: absolute; inset: 0; width: 100%; height: 28px; margin: 0; background: none;
    -webkit-appearance: none; appearance: none; pointer-events: none; }
  .range input::-webkit-slider-runnable-track { height: 28px; background: none; }
  .range input::-moz-range-track { background: none; }
  .range input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; cursor: grab; margin-top: 4px;
    width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .range input::-moz-range-thumb { pointer-events: auto; cursor: grab;
    width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .range input:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ticks { display: flex; justify-content: space-between; padding: 0 4px; font-size: 11px; }
  input[type=date], input[type=month], select { font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; font: inherit; border: 0; background: var(--bg); color: var(--muted); padding: 9px 0; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .check { flex-direction: row; display: flex; align-items: center; gap: 8px; color: var(--text); padding-bottom: 10px; }
  .submit { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px; cursor: pointer; }
  .submit:disabled { opacity: .6; cursor: wait; }

  .notice { margin: 16px 0 0; padding: 10px 14px; border-radius: 10px; font-size: 13px; background: var(--warn-soft); color: var(--warn); }
  .error { background: #fef2f2; color: #b91c1c; }

  .summary { margin: 24px 0 12px; font-size: 15px; }
  .summary b { color: var(--best); font-size: 20px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; position: relative; }
  .card.best { border-color: var(--best); background: var(--best-soft); }
  .badge { position: absolute; top: 14px; right: 14px; font-size: 12px; font-weight: 600; color: #fff; background: var(--best); padding: 3px 8px; border-radius: 999px; }
  .route { font-weight: 600; font-size: 16px; }
  .route small { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .price { font-size: 26px; font-weight: 700; margin: 10px 0 2px; font-variant-numeric: tabular-nums; }
  .diff { font-size: 12px; color: var(--muted); }
  .meta { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .empty { color: var(--muted); font-size: 14px; margin-top: 12px; }
  .book { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; }
  details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  ul.more { list-style: none; padding: 0; margin: 8px 0 0; font-size: 13px; }
  ul.more li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  ul.more li:last-child { border: 0; }
  ul.more a { color: inherit; }
  footer { margin-top: 32px; color: var(--muted); font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>✈️ 도쿄 항공권 최저가</h1>
  <p class="sub" id="sub">김포·인천 → 하네다·나리타 4개 노선을 한 번에 비교해요.</p>

  <form id="f">
    <label>출발지
      <div class="seg" id="dir">
        <button type="button" data-v="seoul" class="on">서울 출발</button>
        <button type="button" data-v="tokyo">도쿄 출발</button>
      </div>
    </label>
    <label>여정
      <div class="seg" id="trip">
        <button type="button" data-v="oneway" class="on">편도</button>
        <button type="button" data-v="round">왕복</button>
      </div>
    </label>
    <label>날짜 단위
      <div class="seg" id="unit">
        <button type="button" data-v="day" class="on">특정일</button>
        <button type="button" data-v="month">한 달</button>
      </div>
    </label>
    <label>출발일 <input id="depart" type="date" required></label>
    <label id="retWrap" hidden>돌아오는 날<input id="ret" type="date"></label>
    <div class="field full">
      <div class="range-head"><span>출발 시각 (가는 편)</span><b id="depLabel">전체</b></div>
      <div class="range" id="dep">
        <div class="track"></div><div class="fill"></div>
        <input type="range" min="0" max="24" step="1" value="0" aria-label="출발 시각 시작">
        <input type="range" min="0" max="24" step="1" value="24" aria-label="출발 시각 끝">
      </div>
      <div class="ticks"><span>0시</span><span>6시</span><span>12시</span><span>18시</span><span>24시</span></div>
    </div>
    <div class="field full">
      <div class="range-head"><span>도착 시각 (가는 편, 현지)</span><b id="arrLabel">전체</b></div>
      <div class="range" id="arr">
        <div class="track"></div><div class="fill"></div>
        <input type="range" min="0" max="24" step="1" value="0" aria-label="도착 시각 시작">
        <input type="range" min="0" max="24" step="1" value="24" aria-label="도착 시각 끝">
      </div>
      <div class="ticks"><span>0시</span><span>6시</span><span>12시</span><span>18시</span><span>24시</span></div>
    </div>
    <label class="check"><input id="direct" type="checkbox" checked> 직항만</label>
    <button class="submit" id="go">최저가 비교</button>
  </form>

  <div id="msg"></div>
  <div id="out"></div>

  <footer>
    가격은 Aviasales(Travelpayouts)가 최근 검색 결과로 수집한 캐시 가격이라 실제 예약 가격과 다를 수 있어요.
    좌석이 없거나 가격이 바뀌었을 수 있으니 예약 페이지에서 꼭 확인하세요.
  </footer>
</main>

<script>
const AIRLINES = { KE:'대한항공', OZ:'아시아나', '7C':'제주항공', LJ:'진에어', TW:'티웨이', BX:'에어부산', RS:'에어서울',
  ZE:'이스타항공', YP:'에어프레미아', JL:'JAL', NH:'ANA', MM:'피치항공', ZG:'ZIPAIR', GK:'젯스타재팬', BC:'스카이마크', HD:'에어두' };
const $ = (id) => document.getElementById(id);
const state = { dir: 'seoul', trip: 'oneway', unit: 'day' };

const won = (n) => n.toLocaleString('ko-KR') + '원';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const day = '일월화수목금토'[d.getDay()];
  return `${d.getMonth() + 1}/${d.getDate()}(${day}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
// 도착 시각 = 출발 + 소요시간(분). 서울·도쿄 모두 UTC+9라 출발 문자열의 시각을 그대로 씀.
function arrival(t) {
  const m = /T(\d{2}):(\d{2})/.exec(t.departAt || '');
  if (!m || t.duration == null) return '';
  const total = Number(m[1]) * 60 + Number(m[2]) + t.duration;
  const days = Math.floor(total / 1440), mins = total % 1440;
  return ` → ${pad(Math.floor(mins / 60))}:${pad(mins % 60)} 도착${days ? ` (+${days}일)` : ''}`;
}
const stops = (n) => (n ? `경유 ${n}회` : '직항');
const airline = (c) => AIRLINES[c] || c;

// 기본 날짜: 2주 뒤 출발, 4일 뒤 귀국
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = new Date();
const d1 = new Date(today); d1.setDate(d1.getDate() + 14);
const d2 = new Date(d1); d2.setDate(d2.getDate() + 3);
$('depart').value = ymd(d1); $('ret').value = ymd(d2);
$('depart').min = $('ret').min = ymd(today);

// 두 손잡이 시간 범위 슬라이더. 반환값: () => [시작시, 끝시]
function rangeSlider(id) {
  const [lo, hi] = $(id).querySelectorAll('input');
  const fill = $(id).querySelector('.fill');
  const label = $(id + 'Label');
  const update = (e) => {
    // 두 손잡이가 겹쳐 잡히지 않게 최소 1시간 간격 유지
    if (+lo.value >= +hi.value) {
      if (e?.target === lo) lo.value = +hi.value - 1; else hi.value = +lo.value + 1;
    }
    const a = +lo.value, b = +hi.value;
    // 손잡이 중심은 양 끝 10px 안쪽에서 움직임
    fill.style.left = `calc(10px + (100% - 20px) * ${a / 24})`;
    fill.style.width = `calc((100% - 20px) * ${(b - a) / 24})`;
    label.textContent = a === 0 && b === 24 ? '전체' : `${pad(a)}:00 ~ ${pad(b)}:00`;
  };
  lo.addEventListener('input', update);
  hi.addEventListener('input', update);
  update();
  return () => [+lo.value, +hi.value];
}
const depRange = rangeSlider('dep');
const arrRange = rangeSlider('arr');

function seg(id, key, onChange) {
  $(id).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    state[key] = b.dataset.v;
    [...$(id).children].forEach((x) => x.classList.toggle('on', x === b));
    onChange?.();
  });
}
seg('dir', 'dir', () => {
  $('sub').textContent = state.dir === 'tokyo'
    ? '하네다·나리타 → 김포·인천 4개 노선을 한 번에 비교해요.'
    : '김포·인천 → 하네다·나리타 4개 노선을 한 번에 비교해요.';
  $('out').innerHTML = '';
});
seg('trip', 'trip', () => { $('retWrap').hidden = state.trip !== 'round'; });
seg('unit', 'unit', () => {
  const type = state.unit === 'month' ? 'month' : 'date';
  for (const el of [$('depart'), $('ret')]) {
    const v = el.value;
    el.type = type;
    el.min = type === 'month' ? ymd(today).slice(0, 7) : ymd(today);
    el.value = type === 'month' ? v.slice(0, 7) : (v.length === 7 ? v + '-01' : v);
  }
});

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const p = new URLSearchParams({ from: state.dir, depart: $('depart').value, direct: $('direct').checked ? '1' : '0' });
  for (const [key, get] of [['dep', depRange], ['arr', arrRange]]) {
    const [a, b] = get();
    if (a !== 0 || b !== 24) { p.set(key + 'From', a); p.set(key + 'To', b); }
  }
  if (state.trip === 'round') {
    if (!$('ret').value) return showMsg('돌아오는 날을 선택해 주세요.', true);
    p.set('return', $('ret').value);
  }
  $('go').disabled = true; $('go').textContent = '검색 중…';
  showMsg(''); $('out').innerHTML = '';
  try {
    const r = await fetch('/api/compare?' + p);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    if (data.mock) showMsg('지금은 샘플 데이터예요. Vercel 환경변수에 TRAVELPAYOUTS_TOKEN을 넣으면 실제 가격이 나와요.');
    render(data);
  } catch (err) {
    showMsg(err.message || '오류가 발생했어요.', true);
  } finally {
    $('go').disabled = false; $('go').textContent = '최저가 비교';
  }
});

function showMsg(text, isError) {
  $('msg').innerHTML = text ? `<p class="notice ${isError ? 'error' : ''}">${esc(text)}</p>` : '';
}

function render({ routes, query }) {
  const priced = routes.filter((r) => r.tickets.length);
  if (!priced.length) {
    $('out').innerHTML = '<p class="summary">해당 조건으로 수집된 가격이 없어요. 날짜를 "한 달"로 넓히거나, 시각 범위를 넓히거나, 직항만 해제해 보세요.</p>';
    return;
  }
  const min = Math.min(...priced.map((r) => r.tickets[0].price));
  const best = priced.find((r) => r.tickets[0].price === min);
  const kind = query.returnAt ? '왕복' : '편도';

  const cards = routes.map((r) => {
    const t = r.tickets[0];
    const isBest = r === best;
    if (!t) return `<div class="card"><div class="route">${r.fromName} → ${r.toName}<small>${r.from}–${r.to}</small></div>
      <p class="empty">수집된 가격 없음</p></div>`;
    const more = r.tickets.slice(1, 6).map((x) => `<li>
        <span>${fmtDate(x.departAt)}${arrival(x).replace(' 도착', '')} · ${esc(airline(x.airline))}</span>
        ${x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">${won(x.price)}</a>` : `<span>${won(x.price)}</span>`}
      </li>`).join('');
    return `<div class="card ${isBest ? 'best' : ''}">
      ${isBest ? '<span class="badge">최저가</span>' : ''}
      <div class="route">${r.fromName} → ${r.toName}<small>${r.from}–${r.to}</small></div>
      <div class="price">${won(t.price)}</div>
      <div class="diff">${isBest ? `${kind} 최저가` : `최저가보다 +${won(t.price - min)}`}</div>
      <div class="meta">
        ${esc(airline(t.airline))} ${esc(t.airline)}${esc(t.flightNumber)} · ${stops(t.transfers)}<br>
        가는 날 ${fmtDate(t.departAt)}${arrival(t)}${t.returnAt ? `<br>오는 날 ${fmtDate(t.returnAt)}` : ''}
      </div>
      ${t.link ? `<a class="book" href="${esc(t.link)}" target="_blank" rel="noopener">예약 페이지 보기 →</a>` : ''}
      ${more ? `<details><summary>다른 항공편 ${r.tickets.slice(1, 6).length}개</summary><ul class="more">${more}</ul></details>` : ''}
    </div>`;
  }).join('');

  $('out').innerHTML = `<p class="summary">가장 싼 노선은 <strong>${best.fromName} → ${best.toName}</strong>, <b>${won(min)}</b></p>
    <div class="grid">${cards}</div>`;
}
</script>
</body>
</html>
